services:
  rest:
    build: .
    image: image-resizer
    ports:
      - '3002:3002'
      - '9229:9229'
    volumes:
      - ./app:/usr/src/app/app
      - ./data:/output
    env_file:
      - ./docker/env/app.env
    command: 'node --run start:rest'
    depends_on:
      - mongo
      - broker

  processor:
    build: .
    image: image-resizer
    volumes:
      - ./app:/usr/src/app/app
      - ./data:/output
    env_file:
      - ./docker/env/app.env
    command: 'node --run start:processor'
    depends_on:
      - mongo
      - broker

  mongo:
    image: mongo:8.2.1
    ports:
      - '27017:27017'
    volumes:
      - mongo_config:/data/configdb
      - mongo_data:/data/db
      - ./docker/db/init.js:/docker-entrypoint-initdb.d/init.js

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zoo_data:/var/lib/zookeeper/data
      - zoo_log:/var/lib/zookeeper/log
      - zoo_secrets:/etc/zookeeper/secrets
  broker:
    image: confluentinc/cp-kafka:7.3.2
    ports:
      - '9092:9092'
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: 'kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
    depends_on:
      - zookeeper
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8080:8080
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  mongo_config:
  mongo_data:
  zoo_data:
  zoo_log:
  zoo_secrets:
  kafka_data:
  kafka_secrets:
